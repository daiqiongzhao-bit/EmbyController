<script>
function appendLog(s){
  const el=document.getElementById('log');
  el.textContent += (s + "\n");
  el.scrollTop = el.scrollHeight;
}
async function postJson(url, data){
  const res = await fetch(url, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(data)
  });
  return await res.json();
}

// ----- browser state -----
let _115_items = [];
let _115_nav = []; // breadcrumb stack: [{cid,name}]

function setCrumb115(){
  const el=document.getElementById('crumb');
  if(!el) return;
  const root = document.getElementById('rootCid115').value.trim() || '0';
  if(!_115_nav.length){
    el.textContent = `当前CID: ${document.getElementById('cid').value.trim()}（rootCid: ${root||'-'}）`;
    return;
  }
  const parts = _115_nav.map(x=>x.name||x.cid);
  el.textContent = parts.join(' / ');
}

function navTo115(cid, name){
  document.getElementById('cid').value = String(cid);
  document.getElementById('offset').value = '0';
  _115_nav.push({cid:String(cid), name:String(name||cid)});
  load115List();
}

function navRoot115(){
  _115_nav = [];
  const root = document.getElementById('rootCid115').value.trim();
  document.getElementById('cid').value = root || '0';
  document.getElementById('offset').value = '0';
  load115List();
}

function navUp115(){
  if(_115_nav.length){
    _115_nav.pop();
  }
  if(_115_nav.length){
    const last=_115_nav[_115_nav.length-1];
    document.getElementById('cid').value = last.cid;
  } else {
    const root = document.getElementById('rootCid115').value.trim();
    document.getElementById('cid').value = root || '0';
  }
  document.getElementById('offset').value = '0';
  load115List();
}

function normItem(raw){
  const isDir = (raw.is_dir===1) || (raw.fc===0) || (raw.file_category===0) || (raw.type==='dir');
  return {
    fileId: String(raw.file_id ?? raw.fid ?? raw.fileId ?? ''),
    cid: String(raw.cid ?? raw.category_id ?? raw.dir_id ?? raw.directory_id ?? raw.folder_id ?? raw.file_id ?? raw.fid ?? ''),
    pickcode: String(raw.pick_code ?? raw.pc ?? raw.pickcode ?? ''),
    name: String(raw.file_name ?? raw.fn ?? raw.name ?? ''),
    isDir: !!isDir,
    size: raw.size ?? raw.fs ?? ''
  };
}

async function load115List(){
  const cid = document.getElementById('cid').value.trim();
  const offset = document.getElementById('offset').value.trim();
  const limit = document.getElementById('limit').value.trim();
  document.getElementById('listSummary').textContent='加载中...';
  const res = await fetch(`/media/admin/strm115B2List?cid=${encodeURIComponent(cid)}&offset=${encodeURIComponent(offset)}&limit=${encodeURIComponent(limit)}`);
  const j = await res.json().catch(()=>({code:500,message:'json parse failed'}));
  appendLog('list: '+JSON.stringify(j).slice(0, 2000));
  if (!j || j.code!==200) {
    document.getElementById('listSummary').textContent = '加载失败：'+(j.message||res.status);
    return;
  }
  let arr = [];
  const data = j.data || {};
  if (Array.isArray(data.data)) arr = data.data;
  else if (Array.isArray(data.files)) arr = data.files;
  else if (Array.isArray(data.data?.list)) arr = data.data.list;
  else if (Array.isArray(data.data?.files)) arr = data.data.files;
  else if (Array.isArray(data.data?.data)) arr = data.data.data;

  _115_items = arr.map(normItem).filter(it=>it.fileId && it.name);

  const dirs = _115_items.filter(x=>x.isDir).length;
  const files = _115_items.filter(x=>!x.isDir).length;
  document.getElementById('listSummary').textContent = `共 ${_115_items.length} 项（文件夹 ${dirs}，文件 ${files}）`;

  render115List();
  setCrumb115();
}

function render115List(){
  const box = document.getElementById('fileList');
  box.innerHTML = '';
  if (!_115_items.length) {
    box.innerHTML = '<div class="text-xs text-gray-500 p-2">暂无数据</div>';
    return;
  }

  const dirs = _115_items.filter(x=>x.isDir);
  const files = _115_items.filter(x=>!x.isDir);

  const mkRow = (html) => {
    const row = document.createElement('div');
    row.className = 'flex items-center gap-2 px-2 py-1 hover:bg-white/5 rounded';
    row.innerHTML = html;
    return row;
  };

  for (const it of dirs) {
    const row = mkRow(`
      <button class="text-xs px-2 py-1 rounded bg-white/5 hover:bg-white/10 border border-white/10" title="进入" data-cid="${escapeHtml(it.cid||it.fileId)}">进入</button>
      <span class="text-gray-400">📁</span>
      <span class="text-sm text-gray-200 truncate" style="max-width:620px">${escapeHtml(it.name)}</span>
      <span class="text-[11px] text-gray-600 ml-auto">cid=${escapeHtml(it.cid||it.fileId)}</span>
    `);
    row.querySelector('button').addEventListener('click', ()=>navTo115(it.cid||it.fileId, it.name));
    row.addEventListener('dblclick', ()=>navTo115(it.cid||it.fileId, it.name));
    box.appendChild(row);
  }

  if (dirs.length && files.length) {
    const sep = document.createElement('div');
    sep.className = 'my-2 border-t border-white/10';
    box.appendChild(sep);
  }

  for (const it of files) {
    const row = mkRow(`
      <input class="accent-blue-500" type="checkbox" data-fileid="${escapeHtml(it.fileId)}" data-name="${escapeHtml(it.name)}" />
      <span class="text-gray-400">🎬</span>
      <span class="text-sm text-gray-200 truncate" style="max-width:660px">${escapeHtml(it.name)}</span>
      <span class="text-[11px] text-gray-600 ml-auto">${escapeHtml(it.fileId)}</span>
    `);
    box.appendChild(row);
  }
}

function selectAll115(on){
  const box = document.getElementById('fileList');
  box.querySelectorAll('input[type=checkbox]').forEach(cb=>{cb.checked=!!on;});
}

async function gen115Strm(){
  const outDir = document.getElementById('outDir115').value.trim();
  const baseUrl = document.getElementById('baseUrl115').value.trim();
  const mode = document.getElementById('mode115').value;
  const rootCid = document.getElementById('rootCid115').value.trim();

  const box = document.getElementById('fileList');
  const sel = [];
  box.querySelectorAll('input[type=checkbox]:checked').forEach(cb=>{
    sel.push({fileId: cb.getAttribute('data-fileid'), name: cb.getAttribute('data-name')});
  });
  if (!sel.length) {
    document.getElementById('genSummary').textContent = '请先勾选文件';
    return;
  }
  if (!outDir || !baseUrl) {
    document.getElementById('genSummary').textContent = 'outDir/baseUrl 不能为空';
    return;
  }
  document.getElementById('genSummary').textContent = '生成中...';

  const r = await postJson('/media/admin/strm115GenStrm', {outDir, baseUrl, items: sel, mode, rootCid});
  appendLog('gen115: '+JSON.stringify(r));
  if (!r || r.code!==200) {
    document.getElementById('genSummary').textContent = '生成失败：'+(r.message||'');
    return;
  }
  document.getElementById('genSummary').textContent = `已生成 ${r.data.count} 个，输出目录：${outDir}`;
}

// init behavior

document.getElementById('rootCid115').addEventListener('change', ()=>{
  const v=document.getElementById('rootCid115').value.trim();
  if(v){ document.getElementById('cid').value=v; }
  _115_nav=[];
  setCrumb115();
});

function escapeHtml(str){
  return String(str).replace(/[&<>\"]/g, s=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[s]));
}
</script>

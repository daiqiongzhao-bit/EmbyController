<script>
function appendLog(s){
  const el=document.getElementById('log');
  el.textContent += (s + "\n");
  el.scrollTop = el.scrollHeight;
}
async function postJson(url, data){
  const res = await fetch(url, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(data)
  });
  return await res.json();
}

document.getElementById('btnSave').addEventListener('click', async ()=>{
  document.getElementById('status').textContent='保存中...';
  const payload={
    enabled: document.getElementById('en').checked,
    root_cid: document.getElementById('rootCid').value.trim(),
  };
  const r = await postJson('/media/admin/strm115Save', payload);
  appendLog(JSON.stringify(r));
  document.getElementById('status').textContent='完成';
});
</script>

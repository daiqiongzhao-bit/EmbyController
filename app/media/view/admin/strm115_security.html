<script>
async function getJson(url){
  const r = await fetch(url, {credentials:'include'});
  return await r.json();
}
async function postJson(url, data){
  const r = await fetch(url, {method:'POST', credentials:'include', headers:{'content-type':'application/json'}, body:JSON.stringify(data||{})});
  return await r.json();
}

async function loadSig(){
  const j = await getJson('/media/admin/strm115SecurityGet');
  if (!j || j.code !== 200) return alert(j && j.message ? j.message : 'load failed');
  const d = j.data || {};
  document.getElementById('sigEnabled').checked = (d.play_sig_enabled === '1');
  document.getElementById('sigLegacy').checked = (d.play_sig_allow_legacy !== '0');
  document.getElementById('sigTtl').value = d.play_sig_ttl || '600';
}

async function saveSig(){
  const payload = {
    play_sig_enabled: document.getElementById('sigEnabled').checked ? '1':'0',
    play_sig_allow_legacy: document.getElementById('sigLegacy').checked ? '1':'0',
    play_sig_ttl: document.getElementById('sigTtl').value.trim() || '600'
  };
  const j = await postJson('/media/admin/strm115SecuritySave', payload);
  if (!j || j.code !== 200) return alert(j && j.message ? j.message : 'save failed');
  alert('已保存');
}

async function genTmp(){
  const fileId = document.getElementById('tmpFileId').value.trim();
  const baseUrl = document.getElementById('tmpBaseUrl').value.trim();
  const j = await postJson('/media/admin/strm115TempLink', {fileId, baseUrl});
  if (!j || j.code !== 200) return alert(j && j.message ? j.message : 'gen failed');
  document.getElementById('tmpOut').value = j.data.url || '';
}

function copyTmp(){
  const v = document.getElementById('tmpOut').value;
  if (!v) return;
  navigator.clipboard.writeText(v);
}

document.getElementById('btnLoadSig').addEventListener('click', loadSig);
document.getElementById('btnSaveSig').addEventListener('click', saveSig);
document.getElementById('btnGenTmp').addEventListener('click', genTmp);
document.getElementById('btnCopyTmp').addEventListener('click', copyTmp);
loadSig();
</script>

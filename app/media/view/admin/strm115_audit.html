<script>
async function getJson(url){
  const r = await fetch(url, {credentials:'include'});
  return await r.json();
}
function esc(s){return (s||'').toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
async function loadAudit(){
  const d = document.getElementById('auditDate').value.trim();
  const fileId = document.getElementById('auditFileId').value.trim();
  const ev = document.getElementById('auditEvent').value;
  const qs = new URLSearchParams({date:d, fileId, event:ev}).toString();
  const url = '/media/admin/strm115AuditData?' + qs;
  const j = await getJson(url);
  if (!j || j.code !== 200) {
    document.getElementById('auditPre').textContent = (j && j.message) ? j.message : '加载失败';
    return;
  }
  document.getElementById('auditMeta').textContent = `lines=${j.data.lines} filtered=${j.data.filtered}`;
  document.getElementById('auditPre').textContent = j.data.text || '';
  document.getElementById('btnDownload').href = '/media/admin/strm115AuditDownload?date=' + encodeURIComponent(d);
}

document.getElementById('btnLoad').addEventListener('click', loadAudit);
loadAudit();
</script>

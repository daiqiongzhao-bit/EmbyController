<h1 class="text-2xl font-bold mb-6">创建影视账户</h1>

<!-- 创建账户表单 -->
<div class="max-w-md mx-auto">
    <div class="space-y-4">
        <div>
            <label for="username" class="block text-sm font-medium text-white/80 mb-1">用户名</label>
            <input
                    type="text"
                    id="username"
                    class="w-full px-4 py-2 rounded-lg bg-white/5 border border-white/10 focus:border-white/20 focus:outline-none"
                    placeholder="请输入用户名"
            >
        </div>
        <button
                class="w-full px-4 py-2 bg-white/10 hover:bg-white/20 rounded-lg transition-colors"
                onclick="createAccount()"
        >
            创建账户
        </button>
    </div>
</div>

<script>
    // 创建账户功能
    function createAccount() {
        const username = document.getElementById('username').value;
        if (username) {
            var data = {
                embyUserName: username
            };
            startMainLoading()
            $.ajax({
                url: '/media/server/create',
                method: 'POST',
                data: data,
                dataType: 'json',
                timeout: 30000,
            }).done(function(res){
                if(res && res.code === 200){
                    rStatusMessage.success(res.message || '创建成功');
                    location.href = '/media/user/index';
                }else{
                    rStatusMessage.error((res && res.message) ? res.message : '创建失败');
                }
            }).fail(function(xhr){
                // 若登录失效后端可能会跳转登录页，这里兜底提示
                if (xhr && (xhr.status === 302 || xhr.status === 401 || xhr.status === 403)) {
                    rStatusMessage.error('登录已失效，请重新登录');
                    location.href = '/media/user/login.html';
                } else {
                    rStatusMessage.error('请求失败，请稍后再试');
                }
            }).always(function(){
                stopMainLoading();
            });
        } else {
            rStatusMessage.error('请输入用户名');
        }
    }
</script>
